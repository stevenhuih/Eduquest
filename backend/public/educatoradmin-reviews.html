<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduQuest - Reviews About Your Center</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Nunito', sans-serif; -webkit-font-smoothing: antialiased; background-color: #fafaf9; }
    .bg-pastel-mesh { position: fixed; inset: 0; z-index: -50; background: radial-gradient(at 0% 0%, rgba(224,231,255,0.5) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(220,252,231,0.4) 0px, transparent 50%); filter: blur(60px); }
    .glass-card { background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.6); }
    .filter-btn.active { background: #4f46e5 !important; color: white !important; border-color: #4f46e5; }
  </style>
</head>
<body class="text-slate-600 pb-12">
  <div class="bg-pastel-mesh"></div>

  <nav class="fixed w-full z-40 pt-4 pb-2 px-4">
    <div class="max-w-7xl mx-auto glass-card rounded-full px-4 py-3 flex items-center justify-between shadow-sm shadow-indigo-100/50">
      <div class="flex items-center gap-3 pl-2">
        <img src="assets/logo.png" alt="EduQuest" class="h-9 w-auto object-contain" />
      </div>
      <div class="hidden md:flex items-center gap-1 p-1 bg-slate-100/50 rounded-full border border-slate-200/50">
        <a href="educatoradmin-dashboard.html" class="hover:text-indigo-600 hover:bg-white/60 transition-all text-sm font-semibold text-slate-500 rounded-full pt-2 pr-5 pb-2 pl-5">Dashboard</a>
        <a href="educatoradmin-subscriptionplan.html" class="hover:text-indigo-600 hover:bg-white/60 transition-all text-sm font-semibold text-slate-500 rounded-full pt-2 pr-5 pb-2 pl-5">Subscription Plan</a>
      </div>
      <div class="flex items-center gap-4 pr-2">
        <div class="hidden sm:flex flex-col items-end">
          <span id="navbar-user-name" class="text-xs font-bold text-slate-700"></span>
          <span id="navbar-role-badge" class="text-[10px] font-bold text-indigo-500 bg-indigo-50 rounded-full pt-0.5 pr-2 pb-0.5 pl-2">Educator Admin</span>
        </div>
        <div class="cursor-pointer hover:ring-indigo-100 transition-all bg-white w-10 h-10 border-indigo-100 border-2 rounded-full ring-transparent ring-2 pt-0.5 pr-0.5 pb-0.5 pl-0.5 relative" onclick="window.location.href='educatoradmin-profile.html'" role="button">
          <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Frizzle&amp;backgroundColor=e0e7ff" alt="Profile" class="w-full h-full object-cover rounded-full">
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto pt-28 px-6">
    <div class="max-w-3xl">
      <!-- Center Reviews Only: Students and educators reviewing this center. No platform reviews here. -->
      <section>
        <h1 class="text-2xl font-bold text-slate-800 mb-2">Reviews About Your Center</h1>
        <p class="text-sm text-slate-500 font-medium mb-4">Reviews from students and educators about your tuition center.</p>
        <div id="reviews-received-list" class="space-y-4">
          <p class="text-slate-400 text-sm">Loading...</p>
        </div>
      </section>
    </div>
  </main>

  <script>
    // Center Reviews Only: Students and educators reviewing this center. DO NOT include platform reviews here.
    var API_BASE = '/api';

    function loadReviewsReceived() {
      var container = document.getElementById('reviews-received-list');
      if (!container) return;
      var headers = typeof getAuthHeaders === 'function' ? getAuthHeaders() : { 'Content-Type': 'application/json' };
      fetch(API_BASE + '/reviews/received', { headers: headers })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var forCenter = data.forCenter || [];
          forCenter.sort(function (a, b) {
            var da = new Date(a.created_at || 0).getTime();
            var db = new Date(b.created_at || 0).getTime();
            return db - da;
          });
          if (forCenter.length === 0) {
            container.innerHTML = '<p class="text-slate-400 text-sm">No reviews yet.</p>';
            return;
          }
          container.innerHTML = forCenter.map(function (r) {
            var date = r.created_at ? new Date(r.created_at).toLocaleDateString() : '—';
            var author = (r.author_role || '').replace(/^./, function (c) { return c.toUpperCase(); });
            var comment = (r.comment || '').trim();
            var commentHtml = comment ? '<p class="text-sm text-slate-600 mt-1">' + String(comment).replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') + '</p>' : '';
            return '<div class="bg-white rounded-xl border border-slate-100 p-4 shadow-sm"><div class="flex items-center justify-between flex-wrap gap-2"><span class="font-bold text-slate-800">' + r.rating + '/5</span><span class="text-xs text-slate-500">' + author + ' · Your center · ' + date + '</span></div>' + commentHtml + '</div>';
          }).join('');
        })
        .catch(function () { container.innerHTML = '<p class="text-slate-400 text-sm">Failed to load reviews.</p>'; });
    }

    document.addEventListener('DOMContentLoaded', function () {
      loadReviewsReceived();
    });

    if (typeof lucide !== 'undefined') lucide.createIcons();
  </script>
</body>
</html>
