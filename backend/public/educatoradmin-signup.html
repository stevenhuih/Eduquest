<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduQuest - Educator Admin Sign Up</title>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root { --font-heading: 'Nunito', sans-serif; --font-body: 'Inter', sans-serif; }
body { font-family: var(--font-body); background-color: #F8FAFC; color: #334155; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
.page-bg { position: fixed; inset: 0; z-index: -50; background: radial-gradient(circle at 0% 0%, rgba(224, 231, 255, 0.5) 0%, transparent 50%), radial-gradient(circle at 100% 100%, rgba(230, 240, 255, 0.5) 0%, transparent 50%), linear-gradient(180deg, #F8FAFC 0%, #F1F5F9 100%); }
.bg-grid-pattern { position: fixed; inset: 0; z-index: -49; opacity: 0.3; background-image: linear-gradient(rgba(148, 163, 184, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(148, 163, 184, 0.1) 1px, transparent 1px); background-size: 40px 40px; mask-image: radial-gradient(circle at 50% 50%, black 40%, transparent 100%); }
.floating-shape { position: absolute; filter: blur(50px); opacity: 0.4; z-index: -48; animation: float 20s infinite alternate ease-in-out; }
@keyframes float { 0% { transform: translate(0, 0) rotate(0deg); } 100% { transform: translate(30px, -30px) rotate(10deg); } }
h1, h2, h3, h4, .brand-font { font-family: var(--font-heading); }
.glass-panel { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.05), 0 0 0 1px rgba(255, 255, 255, 0.5) inset; }
.input-wrapper { position: relative; }
.floating-input { width: 100%; background: white; border: 1px solid #E2E8F0; border-radius: 0.75rem; padding: 1rem 1rem 1rem 2.75rem; font-size: 0.95rem; font-weight: 500; color: #1E293B; outline: none; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
.floating-input:focus { border-color: #818CF8; box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.1); }
.floating-label { position: absolute; left: 2.75rem; top: 1rem; font-size: 0.95rem; color: #94A3B8; pointer-events: none; transition: all 0.2s ease; transform-origin: left top; font-weight: 500; }
.floating-input:focus ~ .floating-label, .floating-input:not(:placeholder-shown) ~ .floating-label { transform: translateY(-0.7rem) scale(0.75); color: #6366F1; font-weight: 700; }
.input-icon { position: absolute; left: 1rem; top: 1.1rem; color: #94A3B8; transition: color 0.2s ease; }
.floating-input:focus ~ .input-icon { color: #6366F1; }
.slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(20px); }
@keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.8s ease-out forwards; opacity: 0; }
@keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body class="min-h-screen flex flex-col lg:flex-row overflow-hidden relative">
  <div class="page-bg"></div>
  <div class="bg-grid-pattern"></div>
  <div class="floating-shape w-96 h-96 bg-indigo-200/30 rounded-full top-[-10%] left-[-10%]"></div>
  <div class="floating-shape w-80 h-80 bg-violet-200/30 rounded-full bottom-[-10%] right-[-5%]" style="animation-delay: -5s;"></div>

  <div class="w-full lg:w-[45%] xl:w-[40%] relative flex flex-col justify-between p-8 lg:p-12 xl:p-16 z-10 fade-in">
    <div class="w-full">
      <img src="assets/logo.png" alt="EduQuest" class="h-10 w-auto object-contain" />
    </div>
    <div class="my-auto py-10">
      <a href="index.html" class="inline-block text-sm font-semibold text-slate-500 hover:text-indigo-600 transition-colors mb-4">Back to landing page</a>
      <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-100/80 border border-slate-200 text-xs font-bold text-slate-600 uppercase tracking-wide mb-6 block">Educator Admin Sign Up</div>
      <h1 class="lg:text-5xl leading-[1.1] text-4xl font-extrabold text-slate-800 tracking-tight mb-4">Create your account</h1>
      <p class="text-lg text-slate-500 font-medium leading-relaxed max-w-md">Set up your tuition center on EduQuest and start managing educators and classes.</p>
    </div>
    <div class="hidden lg:block"><p class="text-xs text-slate-400 font-semibold tracking-wide">© 2026 EDUQUEST INC.</p></div>
  </div>

  <div class="w-full lg:w-[55%] xl:w-[60%] flex items-center justify-center p-4 lg:p-8 relative z-10">
    <div class="glass-panel w-full max-w-[440px] p-8 md:p-10 rounded-[28px] slide-up relative overflow-hidden">
      <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-bl from-indigo-50 to-transparent pointer-events-none"></div>
      <div class="relative z-10">
        <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Sign Up</h2>
        <p id="selected-plan-display" class="text-slate-500 text-sm mt-1.5 font-medium">Selected Plan: BASIC</p>

        <form id="signup-form" class="space-y-6 mt-8">
          <div class="space-y-1">
            <div class="input-wrapper group">
              <input type="text" id="center_name" required placeholder=" " class="floating-input peer" autocomplete="organization">
              <label for="center_name" class="floating-label">Tuition Center Name</label>
              <div class="input-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></div>
            </div>
          </div>
          <div class="space-y-1">
            <div class="input-wrapper group">
              <input type="text" id="admin_name" required placeholder=" " class="floating-input peer" autocomplete="name">
              <label for="admin_name" class="floating-label">Admin Full Name</label>
              <div class="input-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
            </div>
          </div>
          <div class="space-y-1">
            <div class="input-wrapper group">
              <input type="email" id="email" required placeholder=" " class="floating-input peer" autocomplete="email">
              <label for="email" class="floating-label">Email</label>
              <div class="input-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg></div>
            </div>
          </div>
          <div class="space-y-1">
            <div class="input-wrapper group">
              <input type="password" id="password" required placeholder=" " class="floating-input peer pr-10" autocomplete="new-password">
              <label for="password" class="floating-label">Password</label>
              <div class="input-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></div>
            </div>
          </div>
          <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-indigo-600 via-indigo-700 to-slate-800 text-white font-bold text-sm shadow-lg shadow-indigo-200 hover:shadow-indigo-300 transition-all duration-300 transform hover:scale-[1.02] focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 overflow-hidden group">
            <span class="relative flex items-center justify-center gap-2">Create Account</span>
          </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-100">
          <p class="text-center text-sm font-semibold text-slate-500">Already have an account? <a href="educatoradmin-login.html" class="text-indigo-600 font-bold hover:underline">Log in</a></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const API_BASE = '/api';
    const plan = localStorage.getItem("selectedPlan") || "basic";
    document.getElementById("selected-plan-display").textContent = "Selected Plan: " + plan.toUpperCase();

    document.getElementById("signup-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const center_name = document.getElementById("center_name").value.trim();
      const admin_name = document.getElementById("admin_name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!center_name || !admin_name || !email || !password) {
        alert("Please fill in all fields.");
        return;
      }

      try {
        const res = await fetch(API_BASE + "/admins/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ center_name, admin_name, email, password, plan })
        });
        const data = await res.json().catch(function () { return {}; });
        if (!res.ok) {
          alert(data.error || "Signup failed");
          return;
        }
        localStorage.removeItem('studentId');
        localStorage.removeItem('educatorId');
        localStorage.removeItem('adminId');
        localStorage.removeItem('platformAdminId');
        localStorage.removeItem('role');
        localStorage.removeItem('userId');
        localStorage.setItem('role', 'educatoradmin');
        localStorage.setItem('userId', data.id);
        localStorage.setItem("centerName", data.center_name);
        window.location.href = "educatoradmin-dashboard.html";
      } catch (err) {
        console.error(err);
        alert("Signup failed. Please try again.");
      }
    });
  </script>
</body>
</html>
