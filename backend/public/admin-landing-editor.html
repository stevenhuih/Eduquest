<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduQuest - Landing Content Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/api.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Nunito', sans-serif; background-color: #fafaf9; }
    .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.6); }
  </style>
</head>
<body class="text-slate-600 min-h-screen">
  <nav class="fixed top-0 w-full z-40 pt-4 pb-2 px-4">
    <div class="max-w-7xl mx-auto glass-card rounded-full px-4 py-3 flex items-center justify-between shadow-sm">
      <div class="flex items-center gap-3 pl-2">
        <img src="assets/logo.png" alt="EduQuest" class="h-9 w-auto object-contain" />
      </div>
      <div class="hidden md:flex gap-1 bg-slate-100/50 border border-slate-200/50 rounded-full p-1 items-center">
        <a href="admin-dashboard.html" class="text-sm font-semibold text-slate-500 hover:text-indigo-600 rounded-full py-2 px-5">Overview</a>
        <a href="admin-landing-editor.html" class="text-sm font-semibold text-indigo-600 bg-white border border-slate-200/60 rounded-full py-2 px-5 shadow-sm">Landing Editor</a>
      </div>
      <a href="admin-login.html" onclick="event.preventDefault(); logout('admin-login.html');" class="text-xs font-bold text-slate-500 hover:text-rose-600 transition-colors py-2 px-3 rounded-lg hover:bg-rose-50">Log out</a>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto pt-28 px-6 pb-12">
    <h1 class="text-2xl font-bold text-slate-800 mb-2">Landing &amp; Pricing Content</h1>
    <p class="text-slate-500 text-sm mb-8">Edit hero, features, and pricing shown on the public landing and pricing pages.</p>

    <div id="editor-error" class="hidden mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm"></div>
    <div id="editor-success" class="hidden mb-6 p-4 rounded-xl bg-green-50 border border-green-200 text-green-700 text-sm">Saved successfully.</div>

    <form id="landing-form" class="space-y-10">
      <!-- Hero -->
      <section class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6">
        <h2 class="text-lg font-bold text-slate-800 mb-4">Hero</h2>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-slate-600 mb-1">Title</label>
            <input type="text" id="hero-title" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400" placeholder="Make Learning An Adventure" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-600 mb-1">Subtitle</label>
            <textarea id="hero-subtitle" rows="3" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400" placeholder="Engage students with gamified quests..."></textarea>
          </div>
        </div>
      </section>

      <!-- Features -->
      <section class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6">
        <h2 class="text-lg font-bold text-slate-800 mb-4">Features</h2>
        <div id="features-list" class="space-y-6"></div>
      </section>

      <!-- Pricing -->
      <section class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6">
        <h2 class="text-lg font-bold text-slate-800 mb-4">Pricing Plans</h2>
        <div id="pricing-list" class="space-y-6"></div>
      </section>

      <div class="flex justify-end">
        <button type="submit" id="save-btn" class="px-6 py-3 rounded-xl bg-indigo-600 text-white font-bold text-sm hover:bg-indigo-700 transition-colors">Save</button>
      </div>
    </form>
  </main>

  <script>
    lucide.createIcons();

    var editorError = document.getElementById('editor-error');
    var editorSuccess = document.getElementById('editor-success');

    function showError(msg) {
      editorError.textContent = msg || 'Something went wrong.';
      editorError.classList.remove('hidden');
      editorSuccess.classList.add('hidden');
    }
    function showSuccess() {
      editorSuccess.classList.remove('hidden');
      editorError.classList.add('hidden');
    }
    function hideMessages() {
      editorError.classList.add('hidden');
      editorSuccess.classList.add('hidden');
    }

    function loadContent() {
      fetch('/api/content/landing')
        .then(function (r) {
          if (!r.ok) throw new Error('Load failed');
          return r.json();
        })
        .then(function (data) {
          if (data.hero) {
            document.getElementById('hero-title').value = data.hero.title || '';
            document.getElementById('hero-subtitle').value = data.hero.subtitle || '';
          }
          var flist = document.getElementById('features-list');
          flist.innerHTML = '';
          (data.features || []).forEach(function (f, i) {
            var div = document.createElement('div');
            div.className = 'p-4 rounded-xl border border-slate-100 bg-slate-50/50';
            var lab = document.createElement('label');
            lab.className = 'block text-sm font-semibold text-slate-600 mb-2';
            lab.textContent = 'Feature ' + (i + 1);
            var tit = document.createElement('input');
            tit.type = 'text';
            tit.className = 'feature-title w-full px-4 py-2 rounded-lg border border-slate-200 mb-2';
            tit.placeholder = 'Title';
            tit.value = f.title || '';
            var desc = document.createElement('textarea');
            desc.className = 'feature-desc w-full px-4 py-2 rounded-lg border border-slate-200';
            desc.rows = 2;
            desc.placeholder = 'Description';
            desc.value = f.description || '';
            div.appendChild(lab);
            div.appendChild(tit);
            div.appendChild(desc);
            flist.appendChild(div);
          });
          return fetch('/api/pricing').then(function (r) {
            if (!r.ok) throw new Error('Pricing load failed');
            return r.json();
          });
        })
        .then(function (plans) {
          var plist = document.getElementById('pricing-list');
          plist.innerHTML = '';
          (plans || []).forEach(function (p, i) {
            var div = document.createElement('div');
            div.className = 'p-4 rounded-xl border border-slate-100 bg-slate-50/50';
            div.dataset.planId = p.id;
            var lab = document.createElement('label');
            lab.className = 'block text-sm font-semibold text-slate-600 mb-2';
            lab.textContent = 'Plan ' + (i + 1) + (p.is_pro ? ' (Pro)' : '');
            var nameIn = document.createElement('input');
            nameIn.type = 'text';
            nameIn.className = 'pricing-name w-full px-4 py-2 rounded-lg border border-slate-200 mb-2';
            nameIn.placeholder = 'Plan name';
            nameIn.value = p.name || '';
            var priceIn = document.createElement('input');
            priceIn.type = 'number';
            priceIn.min = '0';
            priceIn.className = 'pricing-price w-full px-4 py-2 rounded-lg border border-slate-200 mb-2';
            priceIn.placeholder = 'Price (e.g. 5)';
            priceIn.value = p.price != null ? p.price : '';
            var featuresIn = document.createElement('input');
            featuresIn.type = 'text';
            featuresIn.className = 'pricing-features w-full px-4 py-2 rounded-lg border border-slate-200';
            featuresIn.placeholder = 'Features (comma-separated)';
            featuresIn.value = Array.isArray(p.features) ? p.features.join(', ') : '';
            div.appendChild(lab);
            div.appendChild(nameIn);
            div.appendChild(priceIn);
            div.appendChild(featuresIn);
            plist.appendChild(div);
          });
          hideMessages();
        })
        .catch(function () { showError('Could not load content. Check that the server is running and the API is available.'); });
    }

    document.getElementById('landing-form').addEventListener('submit', function (e) {
      e.preventDefault();
      hideMessages();
      var hero = {
        title: document.getElementById('hero-title').value.trim(),
        subtitle: document.getElementById('hero-subtitle').value.trim()
      };
      var features = [];
      document.querySelectorAll('#features-list > div').forEach(function (row) {
        var title = (row.querySelector('.feature-title') || {}).value || '';
        var desc = (row.querySelector('.feature-desc') || {}).value || '';
        features.push({ title: title.trim(), description: desc.trim() });
      });
      var payload = { hero: hero, features: features };

      var btn = document.getElementById('save-btn');
      btn.disabled = true;
      fetch('/api/content/landing', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
        .then(function (r) {
          if (!r.ok) throw new Error('Save failed');
          return r.json();
        })
        .then(function () {
          var pricingRows = document.querySelectorAll('#pricing-list > div[data-plan-id]');
          if (pricingRows.length === 0) {
            showSuccess();
            btn.disabled = false;
            return;
          }
          var putPromises = [];
          pricingRows.forEach(function (row) {
            var id = row.dataset.planId;
            var name = (row.querySelector('.pricing-name') || {}).value || '';
            var priceVal = (row.querySelector('.pricing-price') || {}).value;
            var price = priceVal !== '' ? parseInt(priceVal, 10) : undefined;
            var featuresStr = (row.querySelector('.pricing-features') || {}).value || '';
            var features = featuresStr.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
            putPromises.push(
              fetch('/api/pricing/' + id, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name.trim(), price: price, features: features })
              }).then(function (r) { if (!r.ok) throw new Error('Pricing save failed'); return r.json(); })
            );
          });
          return Promise.all(putPromises);
        })
        .then(function () {
          showSuccess();
          btn.disabled = false;
        })
        .catch(function () {
          showError('Could not save. Check that the server is running and the API is available.');
          btn.disabled = false;
        });
    });

    loadContent();
  </script>
</body>
</html>
