<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduQuest - Moderate Platform Reviews</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/api.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Nunito', sans-serif; -webkit-font-smoothing: antialiased; background-color: #fafaf9; }
    .bg-pastel-mesh { position: fixed; inset: 0; z-index: -50; background: radial-gradient(at 0% 0%, rgba(224,231,255,0.5) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(220,252,231,0.4) 0px, transparent 50%); filter: blur(60px); }
    .glass-card { background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.6); }
  </style>
</head>
<body class="text-slate-600 pb-12">
  <div class="bg-pastel-mesh"></div>

  <nav class="fixed top-0 w-full z-40 pt-4 pb-2 px-4">
    <div class="max-w-7xl mx-auto glass-card rounded-full px-4 py-3 flex items-center justify-between shadow-sm">
      <div class="flex items-center gap-3 pl-2">
        <img src="assets/logo.png" alt="EduQuest" class="h-9 w-auto object-contain" />
      </div>
      <div class="hidden md:flex gap-1 bg-slate-100/50 border-slate-200/50 border rounded-full p-1 items-center">
        <a href="admin-dashboard.html" class="text-sm font-semibold text-slate-500 hover:text-indigo-600 rounded-full pt-2 pr-5 pb-2 pl-5">Overview</a>
        <a href="admin-reviews.html" class="text-sm font-semibold text-indigo-600 bg-white border rounded-full pt-2 pr-5 pb-2 pl-5 shadow-sm">Platform Reviews</a>
        <a href="admin-shop.html" class="text-sm font-semibold text-slate-500 hover:text-indigo-600 rounded-full pt-2 pr-5 pb-2 pl-5">Manage Shop</a>
      </div>
      <div class="pr-2 flex items-center gap-2">
        <span class="text-[10px] font-bold text-violet-600 bg-violet-100 px-2 py-0.5 rounded-full">Platform Admin</span>
        <div class="w-10 h-10 rounded-full border-2 border-indigo-100 bg-white overflow-hidden">
          <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=System" alt="" class="w-full h-full object-cover" />
        </div>
        <a href="admin-login.html" onclick="event.preventDefault(); logout('admin-login.html');" class="text-xs font-bold text-slate-500 hover:text-rose-600 transition-colors py-2 px-3 rounded-lg hover:bg-rose-50">Log out</a>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto pt-28 px-6">
    <div>
        <h1 class="text-2xl font-bold text-slate-800 mb-2">Moderate Platform Reviews</h1>
        <p class="text-sm text-slate-500 mb-6">Approve or feature reviews for the landing page. Only approved reviews can be featured (max 3 featured).</p>
        <div id="reviews-list" class="space-y-4">
          <p class="text-slate-400 text-sm">Loading...</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Platform Reviews Only: Reviews submitted by students, educators, and educator admins about EduQuest platform itself. Visible only to platform admins.
    if (localStorage.getItem('role') !== 'platformadmin') {
      window.location.href = 'admin-login.html';
    }
    var API_BASE = '/api';

    function roleLabel(role) {
      if (role === 'student') return 'Student';
      if (role === 'educator') return 'Educator';
      if (role === 'educatoradmin') return 'Educator Admin';
      return role || '—';
    }

    function escapeHtml(s) {
      if (s == null) return '';
      var div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    function starsHtml(rating) {
      var r = Math.max(1, Math.min(5, Number(rating) || 0));
      var out = '';
      for (var i = 0; i < 5; i++) {
        out += i < r
          ? '<svg class="w-5 h-5 text-amber-400 fill-current inline" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>'
          : '<svg class="w-5 h-5 text-slate-200 fill-current inline" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
      }
      return out;
    }

    function render(reviews) {
      var el = document.getElementById('reviews-list');
      if (!el) return;
      if (!reviews || reviews.length === 0) {
        el.innerHTML = '<p class="text-slate-400 text-sm">No platform reviews yet.</p>';
        return;
      }
      el.innerHTML = reviews.map(function (r) {
        var date = r.created_at ? new Date(r.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
        var comment = (r.comment || '').trim();
        var commentHtml = comment ? '<p class="text-sm text-slate-600 mt-2">' + escapeHtml(comment) + '</p>' : '';
        var approved = r.is_approved === true;
        var featured = r.is_featured === true;
        return '<div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5" data-id="' + escapeHtml(String(r.id)) + '">' +
          '<div class="flex flex-wrap items-center justify-between gap-2">' +
            '<div class="flex items-center gap-2">' +
              '<span class="font-bold text-slate-800">' + starsHtml(r.rating) + '</span>' +
              '<span class="text-sm text-slate-500">' + (r.rating || 0) + '/5</span>' +
            '</div>' +
            '<span class="text-xs text-slate-500">' + escapeHtml(roleLabel(r.author_role)) + ' · ' + date + '</span>' +
          '</div>' +
          '<p class="text-sm font-semibold text-slate-700 mt-1">' + escapeHtml(r.author_name || '—') + '</p>' +
          commentHtml +
          '<div class="flex flex-wrap gap-2 mt-4">' +
            '<span class="inline-flex items-center gap-1 px-2 py-1 rounded-lg text-xs font-bold ' + (approved ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-slate-100 text-slate-600 border border-slate-200') + '">' + (approved ? 'Approved' : 'Unapproved') + '</span>' +
            '<span class="inline-flex items-center gap-1 px-2 py-1 rounded-lg text-xs font-bold ' + (featured ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'bg-slate-100 text-slate-600 border border-slate-200') + '">' + (featured ? 'Featured' : 'Not featured') + '</span>' +
            '<button type="button" class="approve-btn px-3 py-1.5 rounded-lg text-xs font-bold ' + (approved ? 'bg-slate-200 text-slate-600 hover:bg-rose-100 hover:text-rose-700' : 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200') + '" data-id="' + r.id + '" data-approved="' + !approved + '">' + (approved ? 'Unapprove' : 'Approve') + '</button>' +
            '<button type="button" class="feature-btn px-3 py-1.5 rounded-lg text-xs font-bold ' + (featured ? 'bg-amber-200 text-amber-800 hover:bg-rose-100' : 'bg-amber-50 text-amber-700 hover:bg-amber-100') + '" data-id="' + r.id + '" data-featured="' + !featured + '" ' + (!approved ? 'disabled title="Approve first"' : '') + '>' + (featured ? 'Unfeature' : 'Feature') + '</button>' +
          '</div>' +
          '</div>';
      }).join('');

      document.querySelectorAll('.approve-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-id');
          var approved = btn.getAttribute('data-approved') === 'true';
          patchApprove(id, approved, btn);
        });
      });
      document.querySelectorAll('.feature-btn').forEach(function (btn) {
        if (btn.disabled) return;
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-id');
          var featured = btn.getAttribute('data-featured') === 'true';
          patchFeature(id, featured, btn);
        });
      });
    }

    function patchApprove(id, approved, btn) {
      var headers = typeof getAuthHeaders === 'function' ? getAuthHeaders() : { 'Content-Type': 'application/json' };
      btn.disabled = true;
      fetch(API_BASE + '/platform-reviews/' + encodeURIComponent(id) + '/approve', {
        method: 'PATCH',
        headers: headers,
        body: JSON.stringify({ approved: approved })
      })
        .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
        .then(function (result) {
          btn.disabled = false;
          if (result.ok) {
            load();
          } else {
            alert(result.data && result.data.error ? result.data.error : 'Failed to update approval');
          }
        })
        .catch(function () {
          btn.disabled = false;
          alert('Network error');
        });
    }

    function patchFeature(id, featured, btn) {
      var headers = typeof getAuthHeaders === 'function' ? getAuthHeaders() : { 'Content-Type': 'application/json' };
      btn.disabled = true;
      fetch(API_BASE + '/platform-reviews/' + encodeURIComponent(id) + '/feature', {
        method: 'PATCH',
        headers: headers,
        body: JSON.stringify({ featured: featured })
      })
        .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
        .then(function (result) {
          btn.disabled = false;
          if (result.ok) {
            load();
          } else {
            alert(result.data && result.data.error ? result.data.error : 'Failed to update featured');
          }
        })
        .catch(function () {
          btn.disabled = false;
          alert('Network error');
        });
    }

    function load() {
      var roleParam = 'all';
      var headers = typeof getAuthHeaders === 'function' ? getAuthHeaders() : { 'Content-Type': 'application/json' };
      var url = API_BASE + '/platform-reviews?role=' + encodeURIComponent(roleParam);
      fetch(url, { headers: headers })
        .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
        .then(function (result) {
          if (result.ok && Array.isArray(result.data)) {
            render(result.data);
          } else {
            el = document.getElementById('reviews-list');
            el.innerHTML = '<p class="text-slate-500 text-sm">' + (result.data && result.data.error ? escapeHtml(result.data.error) : 'Failed to load reviews.') + '</p>';
          }
        })
        .catch(function () {
          document.getElementById('reviews-list').innerHTML = '<p class="text-slate-500 text-sm">Failed to load reviews.</p>';
        });
    }

    document.addEventListener('DOMContentLoaded', function () {
      load();
    });

    if (typeof lucide !== 'undefined') lucide.createIcons();
  </script>
</body>
</html>
