<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduQuest - Question Bank</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    :root { --font-family: 'Nunito', sans-serif; }
    body { font-family: var(--font-family); -webkit-font-smoothing: antialiased; background-color: #f0fdfa; overflow-x: hidden; }
    .magical-bg { position: fixed; inset: 0; z-index: -50; background: linear-gradient(135deg, #e0f2fe 0%, #ede9fe 50%, #fff7ed 100%); }
    .glass-card { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02); }
    .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.8); }
    .input-field { background-color: rgba(255, 255, 255, 0.5); border: 1px solid #e2e8f0; transition: all 0.2s; }
    .input-field:focus { background-color: #ffffff; border-color: #818cf8; box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.15); outline: none; }
    @keyframes slide-up { to { opacity: 1; transform: translateY(0); } }
    .animate-enter { animation: slide-up 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; transform: translateY(20px); }
  </style>
</head>
<body class="text-slate-600 selection:bg-indigo-200 selection:text-indigo-900 pb-28">
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/educator-navbar.js"></script>
  <script>requireEducatorAuth();</script>
  <div class="magical-bg"></div>

  <nav class="fixed z-40 transition-all duration-300 w-full pt-4 pr-4 pb-2 pl-4 top-0">
    <div class="glass-card flex bg-[#fafbfe] max-w-7xl rounded-full mr-auto ml-auto pt-3 pr-4 pb-3 pl-4 items-center justify-between shadow-sm shadow-indigo-100/50">
      <div class="flex items-center gap-3 pl-2">
        <img src="assets/logo.png" alt="EduQuest" class="h-9 w-auto object-contain" />
      </div>
      <div class="hidden md:flex items-center gap-1 p-1 rounded-full border bg-slate-100/50 border-slate-200/50">
        <a href="educator-dashboard.html" class="transition-all hover:text-indigo-600 hover:bg-white/60 text-sm font-semibold text-slate-500 rounded-full pt-2 pr-5 pb-2 pl-5">Dashboard</a>
        <a href="educator-class.html" class="transition-all hover:text-indigo-600 hover:bg-white/60 text-sm font-semibold text-slate-500 rounded-full pt-2 pr-5 pb-2 pl-5">My Classes</a>
        <a href="educator-reports.html" class="transition-all hover:text-indigo-600 hover:bg-white/60 text-sm font-semibold text-slate-500 rounded-full pt-2 pr-5 pb-2 pl-5">Reports</a>
      </div>
      <div class="flex items-center gap-4 pr-2">
        <button class="relative p-2 hover:text-indigo-500 transition-colors text-slate-400" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-bell"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
          <span class="absolute top-2 right-2.5 w-2 h-2 bg-rose-500 rounded-full border border-white"></span>
        </button>
        <div class="hidden sm:flex flex-col items-end">
          <span id="navbar-educator-name" class="text-xs font-bold text-slate-700"></span>
          <span id="navbar-role-badge" class="text-[10px] font-bold text-indigo-500 rounded-full pt-0.5 pr-2 pb-0.5 pl-2 bg-indigo-50">Educator</span>
        </div>
        <div class="cursor-pointer transition-all hover:ring-indigo-100 bg-white w-10 h-10 border-indigo-100 border-2 rounded-full ring-transparent ring-2 pt-0.5 pr-0.5 pb-0.5 pl-0.5 relative" onclick="window.location.href='educator-profile.html'" role="button">
          <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Frizzle&amp;backgroundColor=e0e7ff" alt="Profile" class="w-full h-full object-cover rounded-full">
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto pt-28 pb-12 px-6">
    <div class="mb-8 animate-enter">
      <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Question Bank</h1>
      <p class="text-slate-500 font-medium mt-1">Manage reusable questions for this class</p>
    </div>

    <div id="topics-panel" class="mb-6 animate-enter glass-card rounded-2xl p-4">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
        <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wide">Topics</h2>
        <button type="button" id="add-topic-btn" class="flex items-center gap-2 px-3 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl transition-colors">Add Topic</button>
      </div>
      <ul id="topics-list" class="flex flex-wrap gap-2"></ul>
    </div>

    <div class="flex flex-wrap items-center gap-4 mb-6 animate-enter">
      <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Topic</label>
      <select id="topic-filter" class="input-field rounded-xl px-4 py-2.5 text-sm font-semibold text-slate-700 min-w-[140px]">
        <option value="all">All topics</option>
      </select>
      <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Difficulty</label>
      <select id="difficulty-filter" class="input-field rounded-xl px-4 py-2.5 text-sm font-semibold text-slate-700 min-w-[120px]">
        <option value="all">All</option>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
      <input id="search-input" type="text" placeholder="Search questions..." class="input-field w-72 rounded-xl px-4 py-2.5 text-sm font-semibold text-slate-700">
      <button type="button" id="add-question-btn" class="flex items-center gap-2 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold rounded-xl shadow-lg shadow-indigo-200">Add Question</button>
    </div>

    <div id="questionBankList" class="space-y-4 animate-enter">
      <div class="glass-card rounded-2xl p-6 text-center text-slate-400 text-sm font-medium">No questions yet. Use <strong class="text-indigo-600">Add Question</strong> to add your first question.</div>
    </div>
  </main>

  <div id="add-topic-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-slate-900/20 backdrop-blur-sm" id="add-topic-backdrop"></div>
    <div class="relative bg-white rounded-2xl shadow-xl p-6 w-full max-w-md">
      <h2 class="text-lg font-bold text-slate-800 mb-2">Add Topic</h2>
      <input type="text" id="add-topic-name" class="input-field w-full rounded-xl px-4 py-2.5 text-sm font-medium text-slate-700 mb-4" placeholder="Topic name">
      <div class="flex gap-3">
        <button type="button" id="add-topic-cancel" class="flex-1 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-sm">Cancel</button>
        <button type="button" id="add-topic-save" class="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm">Save</button>
      </div>
    </div>
  </div>

  <div id="add-question-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-slate-900/20 backdrop-blur-sm" id="add-question-backdrop"></div>
    <div class="relative bg-white rounded-2xl shadow-xl p-6 w-full max-w-xl max-h-[90vh] overflow-y-auto">
      <h2 id="add-question-modal-title" class="text-xl font-bold text-slate-800 mb-1">Add Question</h2>
      <p class="text-sm text-slate-500 mb-4">Create a reusable question for your question bank.</p>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Topic</label>
          <select id="modal-topic" class="input-field w-full rounded-xl px-4 py-2.5 text-sm font-semibold text-slate-700"><option value="">Select topic</option></select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Difficulty</label>
          <select id="modal-difficulty" class="input-field w-full rounded-xl px-4 py-2.5 text-sm font-semibold text-slate-700">
            <option value="">Select difficulty</option>
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Question text</label>
          <textarea id="modal-question-text" class="input-field w-full rounded-xl px-4 py-3 text-sm font-medium text-slate-700 h-24 resize-none" placeholder="Enter your question..."></textarea>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Options (mark one correct)</label>
          <div id="modal-options-list"></div>
          <button type="button" id="modal-add-option-btn" class="mt-2 text-sm font-bold text-indigo-600 hover:text-indigo-700">+ Add option</button>
        </div>
      </div>
      <div class="flex gap-3 mt-6">
        <button type="button" id="modal-cancel-btn" class="flex-1 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-sm">Cancel</button>
        <button type="button" id="modal-save-btn" class="flex-1 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm">Save Question</button>
      </div>
    </div>
  </div>

  <script>
(function () {
  var API_BASE = '/api';
  var params = new URLSearchParams(window.location.search);
  var rawClassId = params.get('classId');
  var CLASS_ID = (rawClassId != null && rawClassId !== '' && !isNaN(Number(rawClassId))) ? Number(rawClassId) : null;
  if (!rawClassId || rawClassId === '' || CLASS_ID == null) {
    console.error('Missing classId in URL');
  }

  var allQuestions = [];
  var questionBankMap = {};
  var editingQuestionId = null;
  var classTopics = [];
  var modalCorrectName = 'modal-correct-' + Date.now();

  function loadTopics() {
    if (CLASS_ID == null) return Promise.resolve();
    return fetch(API_BASE + '/topics/class/' + CLASS_ID, { headers: getAuthHeaders() })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (topics) {
        classTopics = Array.isArray(topics) ? topics : [];
        var listEl = document.getElementById('topics-list');
        if (listEl) {
          listEl.innerHTML = '';
          classTopics.forEach(function (t) {
            var li = document.createElement('li');
            li.className = 'flex items-center gap-2 px-3 py-1.5 bg-white/80 border border-slate-200 rounded-xl text-sm font-semibold text-slate-700';
            li.innerHTML = '<span>' + (t.name || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</span>' +
              '<button type="button" class="topic-delete-btn text-rose-500 hover:bg-rose-50 p-1 rounded" data-id="' + t.id + '" aria-label="Delete">×</button>';
            listEl.appendChild(li);
          });
        }
        var filterSel = document.getElementById('topic-filter');
        var modalSel = document.getElementById('modal-topic');
        if (filterSel) {
          filterSel.innerHTML = '<option value="all">All topics</option>';
          classTopics.forEach(function (t) {
            var o = document.createElement('option');
            o.value = String(t.id);
            o.textContent = t.name || '';
            filterSel.appendChild(o);
          });
        }
        if (modalSel) {
          modalSel.innerHTML = '<option value="">Select topic</option>';
          classTopics.forEach(function (t) {
            var o = document.createElement('option');
            o.value = String(t.id);
            o.textContent = t.name || '';
            modalSel.appendChild(o);
          });
        }
      })
      .catch(function (e) { console.error('Topics load error', e); });
  }

  function loadQuestionList() {
    if (CLASS_ID == null) {
      var container = document.getElementById('questionBankList');
      if (container) container.innerHTML = '<div class="glass-card rounded-2xl p-6 text-center text-slate-500 text-sm">No class selected. Open this page from a class (e.g. Manage Class → Open Question Bank).</div>';
      document.getElementById('topics-panel').classList.add('hidden');
      return;
    }
    document.getElementById('topics-panel').classList.remove('hidden');
    fetch(API_BASE + '/questionbank/class/' + CLASS_ID, { headers: getAuthHeaders() })
      .then(function (r) {
        if (!r.ok) throw new Error(r.status === 403 ? 'Access denied' : 'Failed to load');
        return r.json();
      })
      .then(function (data) {
        var questions = Array.isArray(data) ? data : [];
        allQuestions = questions;
        questionBankMap = {};
        allQuestions.forEach(function (q) { if (q && q.id != null) questionBankMap[q.id] = q; });
        applyFilters();
      })
      .catch(function (err) {
        console.error(err);
        var container = document.getElementById('questionBankList');
        if (container) container.innerHTML = '<div class="glass-card rounded-2xl p-6 text-center text-slate-500 text-sm">Failed to load questions. Check console. Ensure you opened this page from a class.</div>';
      });
  }

  function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderQuestionCards(list) {
    var container = document.getElementById('questionBankList');
    if (!container) return;
    container.innerHTML = '';
    if (!Array.isArray(list)) list = [];
    if (list.length === 0) {
      container.innerHTML = allQuestions.length === 0
        ? '<div class="glass-card rounded-2xl p-6 text-center text-slate-400 text-sm font-medium">No questions yet. Use <strong class="text-indigo-600">Add Question</strong> to add your first question.</div>'
        : '<div class="glass-card rounded-2xl p-6 text-center text-slate-400 text-sm font-medium">No matching questions.</div>';
      return;
    }
    list.forEach(function (q) {
      if (!q || q.id == null) return;
      var topicLabel = (q.topic_name || q.topic || '').replace(/^./, function (c) { return c.toUpperCase(); });
      var diffLabel = (q.difficulty || '').replace(/^./, function (c) { return c.toUpperCase(); });
      var opts = q.options || [];
      var optionsHtml = opts.map(function (opt) {
        var text = esc(opt.option_text);
        return opt.is_correct
          ? '<li class="flex items-center gap-2 px-3 py-2 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm">' + text + '</li>'
          : '<li class="flex items-center gap-2 px-3 py-2 rounded-lg bg-slate-50 text-slate-700 text-sm">' + text + '</li>';
      }).join('');
      var card = document.createElement('div');
      card.className = 'glass-card rounded-2xl p-6';
      card.innerHTML = '<p class="font-bold text-slate-800 mb-3">' + esc(q.question_text) + '</p>' +
        '<div class="flex flex-wrap gap-2 mb-4">' +
        '<span class="px-2.5 py-1 rounded-md text-[10px] font-extrabold uppercase bg-indigo-50 text-indigo-700 border border-indigo-100">' + esc(topicLabel) + '</span>' +
        '<span class="px-2.5 py-1 rounded-md text-[10px] font-extrabold uppercase bg-slate-100 text-slate-600">' + esc(diffLabel) + '</span>' +
        '</div><ul class="space-y-1.5">' + optionsHtml + '</ul>' +
        '<div class="mt-4 pt-4 border-t border-slate-100 flex gap-2">' +
        '<button type="button" class="edit-question-btn px-3 py-1.5 text-xs font-bold text-indigo-600 hover:bg-indigo-50 rounded-lg" data-id="' + esc(String(q.id)) + '">Edit</button>' +
        '<button type="button" class="delete-question-btn px-3 py-1.5 text-xs font-bold text-rose-600 hover:bg-rose-50 rounded-lg" data-id="' + esc(String(q.id)) + '">Delete</button>' +
        '</div>';
      container.appendChild(card);
    });
  }

  function applyFilters() {
    if (!Array.isArray(allQuestions)) allQuestions = [];
    var topicVal = (document.getElementById('topic-filter') && document.getElementById('topic-filter').value) || 'all';
    var difficulty = (document.getElementById('difficulty-filter') && document.getElementById('difficulty-filter').value) || 'all';
    var search = (document.getElementById('search-input') && document.getElementById('search-input').value || '').toLowerCase();
    var filtered = allQuestions.filter(function (q) {
      var topicMatch = topicVal === 'all' || String(q.topic_id) === topicVal || (q.topic_name && q.topic_name === topicVal) || (q.topic && q.topic === topicVal);
      var difficultyMatch = difficulty === 'all' || q.difficulty === difficulty;
      var searchMatch = search === '' || (q.question_text && q.question_text.toLowerCase().includes(search)) || ((q.topic_name || q.topic) && (q.topic_name || q.topic).toLowerCase().includes(search));
      return topicMatch && difficultyMatch && searchMatch;
    });
    renderQuestionCards(filtered);
  }

  var optionsList = document.getElementById('modal-options-list');
  function addOptionRow() {
    var idx = optionsList.children.length;
    var row = document.createElement('div');
    row.className = 'modal-option-row flex gap-2 items-center mb-2';
    row.innerHTML = '<input type="text" class="modal-option-text input-field flex-1 rounded-lg px-3 py-2 text-sm" placeholder="Option text">' +
      '<input type="radio" name="' + modalCorrectName + '" value="' + idx + '"> <span class="text-xs font-bold text-slate-500">Correct</span>' +
      '<button type="button" class="modal-option-remove text-rose-500 hover:bg-rose-50 p-1 rounded">×</button>';
    optionsList.appendChild(row);
  }
  for (var i = 0; i < 2; i++) addOptionRow();
  document.getElementById('modal-add-option-btn').addEventListener('click', addOptionRow);
  optionsList.addEventListener('click', function (e) {
    if (e.target.closest('.modal-option-remove')) {
      var row = e.target.closest('.modal-option-row');
      if (row && optionsList.children.length > 2) row.remove();
    }
  });

  var modal = document.getElementById('add-question-modal');
  var backdrop = document.getElementById('add-question-backdrop');
  function openModal() { modal.classList.remove('hidden'); }
  function closeModal() { modal.classList.add('hidden'); }
  function resetModalForm() {
    document.getElementById('modal-topic').value = '';
    document.getElementById('modal-difficulty').value = '';
    document.getElementById('modal-question-text').value = '';
    while (optionsList.children.length > 2) optionsList.removeChild(optionsList.lastChild);
    for (var i = 0; i < 2; i++) addOptionRow();
    var radios = optionsList.querySelectorAll('input[type="radio"]');
    if (radios[0]) radios[0].checked = true;
  }

  document.getElementById('add-question-btn').addEventListener('click', function () {
    editingQuestionId = null;
    document.getElementById('add-question-modal-title').textContent = 'Add Question';
    document.getElementById('modal-save-btn').textContent = 'Save Question';
    resetModalForm();
    openModal();
  });
  backdrop.addEventListener('click', closeModal);
  document.getElementById('modal-cancel-btn').addEventListener('click', closeModal);

  document.getElementById('modal-save-btn').addEventListener('click', function () {
    var topicVal = document.getElementById('modal-topic').value;
    var topic_id = (topicVal && !isNaN(parseInt(topicVal, 10))) ? parseInt(topicVal, 10) : null;
    var difficulty = (document.getElementById('modal-difficulty').value || '').trim();
    var question_text = (document.getElementById('modal-question-text').value || '').trim();
    if ((!topic_id && !topicVal) || !difficulty || !question_text) {
      alert('Please select topic, difficulty, and enter question text.');
      return;
    }
    var rows = optionsList.querySelectorAll('.modal-option-row');
    var options = [];
    var checkedRadio = optionsList.querySelector('input[name="' + modalCorrectName + '"]:checked');
    var checkedIndex = checkedRadio ? parseInt(checkedRadio.value, 10) : -1;
    rows.forEach(function (row, index) {
      var textInp = row.querySelector('.modal-option-text');
      options.push({ option_text: (textInp && textInp.value) ? textInp.value.trim() : '', is_correct: index === checkedIndex });
    });
    if (options.length < 2) { alert('At least 2 options required.'); return; }
    var correctCount = options.filter(function (o) { return o.is_correct; }).length;
    if (correctCount !== 1) { alert('Exactly one option must be marked correct.'); return; }

    var payload = { topic_id: topic_id, topic: topicVal, difficulty: difficulty, question_text: question_text, options: options };
    var btn = this;
    btn.disabled = true;
    if (editingQuestionId != null) {
      fetch(API_BASE + '/questionbank/' + editingQuestionId, {
        method: 'PUT',
        headers: getAuthHeaders(),
        body: JSON.stringify(payload)
      }).then(function (r) {
        if (!r.ok) return r.json().then(function (d) { throw new Error(d.error || 'Update failed'); });
        closeModal();
        resetModalForm();
        loadQuestionList();
      }).catch(function (err) { alert(err.message || 'Update failed'); }).finally(function () { btn.disabled = false; });
    } else {
      if (CLASS_ID == null) { alert('No class selected.'); btn.disabled = false; return; }
      var createPayload = { class_id: CLASS_ID, topic_id: topic_id, topic: topicVal, difficulty: difficulty, question_text: question_text, options: options };
      fetch(API_BASE + '/questionbank', {
        method: 'POST',
        headers: getAuthHeaders(),
        body: JSON.stringify(createPayload)
      }).then(function (r) {
        if (!r.ok) return r.json().then(function (d) { throw new Error(d.error || 'Save failed'); });
        closeModal();
        resetModalForm();
        loadQuestionList();
      }).catch(function (err) { alert(err.message || 'Save failed'); }).finally(function () { btn.disabled = false; });
    }
  });

  document.addEventListener('click', function (e) {
    var editBtn = e.target.closest('.edit-question-btn');
    if (editBtn) {
      var q = questionBankMap[editBtn.dataset.id];
      if (!q) return;
      editingQuestionId = q.id;
      document.getElementById('add-question-modal-title').textContent = 'Edit Question';
      document.getElementById('modal-save-btn').textContent = 'Save Changes';
      document.getElementById('modal-topic').value = q.topic_id != null ? String(q.topic_id) : (q.topic || '');
      document.getElementById('modal-difficulty').value = q.difficulty || '';
      document.getElementById('modal-question-text').value = q.question_text || '';
      // Replace options: clear all rows then add exactly one per option (no duplicates)
      while (optionsList.children.length > 0) optionsList.removeChild(optionsList.firstChild);
      (q.options || []).forEach(function (opt, i) {
        addOptionRow();
        var rows = optionsList.querySelectorAll('.modal-option-row');
        var row = rows[rows.length - 1];
        if (row) {
          var textInp = row.querySelector('.modal-option-text');
          if (textInp) textInp.value = opt.option_text != null ? String(opt.option_text) : '';
          if (opt.is_correct) row.querySelector('input[type="radio"]').checked = true;
        }
      });
      if ((q.options || []).length < 2) addOptionRow();
      openModal();
      return;
    }
    var delBtn = e.target.closest('.delete-question-btn');
    if (delBtn && confirm('Delete this question?')) {
      var id = delBtn.dataset.id;
      fetch(API_BASE + '/questionbank/' + id, { method: 'DELETE', headers: getAuthHeaders() })
        .then(function (r) { if (!r.ok) throw new Error('Delete failed'); loadQuestionList(); })
        .catch(function (err) { alert('Delete failed'); });
    }
    var topicDel = e.target.closest('.topic-delete-btn');
    if (topicDel) {
      var id = topicDel.getAttribute('data-id');
      if (!id || !confirm('Delete this topic?')) return;
      fetch(API_BASE + '/topics/' + id, { method: 'DELETE', headers: getAuthHeaders() })
        .then(function (r) { if (!r.ok) throw new Error('Delete failed'); return loadTopics(); })
        .catch(function (err) { alert('Delete failed'); });
    }
  });

  document.getElementById('topic-filter').addEventListener('change', applyFilters);
  document.getElementById('difficulty-filter').addEventListener('change', applyFilters);
  document.getElementById('search-input').addEventListener('input', applyFilters);

  (function initAddTopicModal() {
    var addTopicModal = document.getElementById('add-topic-modal');
    var addTopicBackdrop = document.getElementById('add-topic-backdrop');
    var addTopicName = document.getElementById('add-topic-name');
    var addTopicBtn = document.getElementById('add-topic-btn');
    var addTopicCancel = document.getElementById('add-topic-cancel');
    var addTopicSave = document.getElementById('add-topic-save');
    function openAddTopicModal() {
      if (CLASS_ID == null) { alert('No class selected.'); return; }
      addTopicModal.classList.remove('hidden');
      addTopicName.value = '';
      addTopicName.focus();
    }
    function closeAddTopicModal() { addTopicModal.classList.add('hidden'); }
    addTopicBtn.addEventListener('click', openAddTopicModal);
    addTopicBackdrop.addEventListener('click', closeAddTopicModal);
    addTopicCancel.addEventListener('click', closeAddTopicModal);
    addTopicSave.addEventListener('click', function () {
      var name = (addTopicName.value || '').trim();
      if (!name) { alert('Enter a topic name.'); return; }
      addTopicSave.disabled = true;
      fetch(API_BASE + '/topics', {
        method: 'POST',
        headers: getAuthHeaders(),
        body: JSON.stringify({ name: name, class_id: CLASS_ID })
      }).then(function (r) {
        if (!r.ok) return r.json().then(function (d) { throw new Error(d.error || 'Failed'); });
        closeAddTopicModal();
        return loadTopics();
      }).catch(function (e) { alert(e.message || 'Failed to add topic'); }).finally(function () { addTopicSave.disabled = false; });
    });
  })();

  function initPage() {
    var manageLink = document.getElementById('nav-manageclass');
    if (manageLink && CLASS_ID != null) manageLink.setAttribute('href', 'educator-manageclass.html?classId=' + CLASS_ID);
    loadQuestionList();
    if (CLASS_ID != null) loadTopics();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initPage);
  } else {
    initPage();
  }
})();
  </script>
</body>
</html>
